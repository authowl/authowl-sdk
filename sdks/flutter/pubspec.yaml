name: authowl
description: >-
  Official AuthOwl Flutter SDK with localized authentication widgets,
  provider-managed sessions, and secure-storage integration.
version: 0.3.0
repository: https://github.com/authowl/authowl-sdk
homepage: https://authowl.dev

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # Imported directly by the provider so an app can inject its own transport.
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.24.0
