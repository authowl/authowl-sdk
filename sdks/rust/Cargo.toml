[package]
name = "authowl"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Server-side token verification and webhook helpers for AuthOwl, the multi-tenant auth SaaS."
license = "MIT"
repository = "https://github.com/authowl/authowl-sdk"
homepage = "https://authowl.dev"
keywords = ["authentication", "auth", "jwt", "authowl", "oauth"]
categories = ["authentication", "web-programming"]
readme = "README.md"

# Pure-Rust crypto on purpose: no OpenSSL, so this builds and cross-compiles
# anywhere cargo does, including musl and containers with no system libraries.
[dependencies]
base64 = "0.22"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
