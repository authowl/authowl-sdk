# CI - plan 11, task 0.5 (SDK repo).
# Gates every PR and push to main with the same `pnpm ci:local` command used
# before local merges and package releases.
#
# Supply-chain: this SDK ships to end-user browsers, so every third-party action
# is pinned to a full commit SHA (tag hijacks are a real attack). Dependabot
# (task 0.2, github-actions ecosystem) keeps the pins fresh.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: canonical exact-commit pinned-Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTHOWL_CI_RESULT_DIR: ${{ github.workspace }}/.authowl-ci/results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run canonical gate
        run: bash scripts/ci/local-gate.sh
      - name: Upload screenshot failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-failures
          path: ${{ env.AUTHOWL_CI_RESULT_DIR }}/run.*/screenshot-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
