# Dependabot for the pnpm workspace and pinned GitHub Actions.
version: 2
updates:
  # npm: the root owns the complete pnpm workspace lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Cairo
    open-pull-requests-limit: 10
    # Let a freshly-published version bake before we pull it - cheap insurance
    # against a compromised release. Security advisories bypass the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      react:
        # Ordered before dev-dependencies so @types/react* group here.
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        # Keep routine updates reviewable. Major toolchain migrations need their
        # own compatibility work and must not be hidden inside a bulk PR.
        update-types:
          - minor
          - patch
    ignore:
      # Version-update majors are scheduled deliberately. Security updates use
      # Dependabot's separate advisory path and are not excluded by this rule.
      - dependency-name: "*"
        dependency-type: development
        update-types:
          - version-update:semver-major

  # GitHub Actions: keep SHA-pinned actions fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Cairo
    cooldown:
      default-days: 7
